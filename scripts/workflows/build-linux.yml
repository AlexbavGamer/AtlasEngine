# GitHub Actions workflow for building the Atlas game for Linux.
# Copy this file into your project repo as .github/workflows/build-linux.yml
name: Build Linux Game

on:
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build \
            libvulkan-dev \
            libglfw3-dev \
            libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxkbcommon-dev

      - name: Install premake5
        run: |
          wget -q \
            https://github.com/premake/premake-core/releases/download/\
            v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar xzf premake-5.0.0-beta2-linux.tar.gz
          sudo mv premake5 /usr/local/bin/

      - name: Build game
        run: |
          chmod +x ./scripts/build_linux.sh
          ./scripts/build_linux.sh game ./export/game

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-linux
          path: |
            bin/Release/game
            bin/Release/game/game
            export/game/**
