---
name: Build

# Premake5-only pipeline (CMake was removed from the repo).
# Dependencies are fetched by scripts/fetch_deps.sh
# into deps/src (cached).

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREMAKE_VERSION: v5.0.0-beta2
  PREMAKE_URL: https://github.com/premake/premake-core/releases/download

jobs:
  build-linux:
    name: Linux premake build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: deps/src
          key: >-
            ${{ runner.os }}-deps-${{
            hashFiles('premake5.lua', 'scripts/fetch_deps.sh') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            build-essential \
            python3 \
            libvulkan-dev \
            glslc \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install premake5
        run: |
          VER="${PREMAKE_VERSION}"
          wget -q "$PREMAKE_URL/$VER/premake-$VER-linux.tar.gz"
          tar xzf "premake-$VER-linux.tar.gz"
          sudo mv premake5 /usr/local/bin/
          premake5 --version

      - name: Fetch dependencies
        run: |
          chmod +x ./scripts/fetch_deps.sh
          chmod +x ./scripts/build_shaders.sh
          ./scripts/fetch_deps.sh

      - name: Build shaders
        run: ./scripts/build_shaders.sh

      - name: Generate + build
        run: |
          premake5 ninja
          ninja -C build AtlasEngine_Release

      - name: Stage Linux artifact
        run: |
          mkdir -p dist/linux
          cp bin/Release/AtlasEngine dist/linux/
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasEngine-linux
          path: dist/linux
          if-no-files-found: error

  build-windows:
    name: Windows premake build
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: deps/src
          key: >-
            ${{ runner.os }}-deps-${{
            hashFiles('premake5.lua', 'scripts/fetch_deps.sh') }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdkRoot = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkRoot) {
            throw 'Vulkan SDK installation failed.'
          }
          "VULKAN_SDK=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW + Ninja + premake5
        shell: pwsh
        run: |
          choco install mingw ninja --yes --no-progress
          $ver = $env:PREMAKE_VERSION
          $base = $env:PREMAKE_URL
          $zip = "$env:RUNNER_TEMP\premake.zip"
          Invoke-WebRequest -Uri "$base/$ver/premake-$ver-windows.zip" `
            -OutFile $zip
          Expand-Archive $zip `
            -DestinationPath "$env:RUNNER_TEMP\premake"
          "$env:RUNNER_TEMP\premake" | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          RefreshEnv.cmd

      - name: Fetch dependencies
        shell: bash
        run: ./scripts/fetch_deps.sh

      - name: Generate + build
        shell: bash
        run: |
          export PATH="$VULKAN_SDK/Bin:$PATH"
          premake5 ninja
          ninja -C build AtlasEngine_Release

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item bin/Release/AtlasEngine.exe dist/windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasEngine-windows
          path: dist/windows
          if-no-files-found: error
