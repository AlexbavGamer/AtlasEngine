name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Ubuntu CMake build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: deps/src
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libvulkan-dev \
            glslc \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TRACY=OFF

      - name: Build
        run: cmake --build build --config Release --target AtlasEngine

      - name: Stage Linux artifact
        run: |
          mkdir -p dist/linux
          cp build/AtlasEngine dist/linux/
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasEngine-linux
          path: dist/linux
          if-no-files-found: error

  build-windows:
    name: Windows CMake build
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: deps/src
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdkRoot = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkRoot) {
            throw 'Vulkan SDK installation failed.'
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TRACY=OFF

      - name: Build
        run: cmake --build build --config Release --target AtlasEngine

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/AtlasEngine.exe dist/windows/
          if (Test-Path build/shaders) {
            Copy-Item build/shaders dist/windows/ -Recurse
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasEngine-windows
          path: dist/windows
          if-no-files-found: error

